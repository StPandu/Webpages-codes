<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Library | Songs</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="brand">Music Library</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="artists.html">Artists</a>
      <a href="albums.html">Albums</a>
      <a href="songs.html" class="active">Songs</a>
    </div>
  </nav>

  <main class="container">
    <section class="card">
      <h1>Songs</h1>
      <p class="status" id="song-status">Loading songs...</p>
    </section>

    <section class="card form-card">
      <h2>Song Form</h2>
      <form id="song-form">
        <div class="form-grid">
          <div>
            <label for="song-id">Song ID (for update)</label>
            <input type="number" id="song-id" />
          </div>
          <div>
            <label for="song-name">Song Name</label>
            <input type="text" id="song-name" required />
          </div>
          <div>
            <label for="song-year">Release Year</label>
            <input type="number" id="song-year" required />
          </div>
          <div>
            <label for="song-album-id">Album ID</label>
            <input type="number" id="song-album-id" required />
          </div>
          <div>
            <label for="song-delete-id">Song ID to Delete</label>
            <input type="number" id="song-delete-id" />
          </div>
        </div>
        <div class="button-row">
          <button type="submit" class="btn">Create</button>
          <button type="button" class="btn secondary" id="song-update-btn">Update</button>
          <button type="button" class="btn danger" id="song-delete-btn">Delete</button>
          <button type="button" class="btn ghost" id="song-reset-btn">Clear</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>All Songs</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Release Year</th>
              <th>Album ID</th>
              <th>Album Name</th>
            </tr>
          </thead>
          <tbody id="songs-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/songs.js"></script>
</body>
</html>
