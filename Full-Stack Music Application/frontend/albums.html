<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Library | Albums</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="brand">Music Library</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="artists.html">Artists</a>
      <a href="albums.html" class="active">Albums</a>
      <a href="songs.html">Songs</a>
    </div>
  </nav>

  <main class="container">
    <section class="card">
      <h1>Albums</h1>
      <p class="status" id="album-status">Loading albums...</p>
    </section>

    <section class="card form-card">
      <h2>Album Form</h2>
      <form id="album-form">
        <div class="form-grid">
          <div>
            <label for="album-id">Album ID (for update)</label>
            <input type="number" id="album-id" />
          </div>
          <div>
            <label for="album-name">Album Name</label>
            <input type="text" id="album-name" required />
          </div>
          <div>
            <label for="album-year">Release Year</label>
            <input type="number" id="album-year" required />
          </div>
          <div>
            <label for="album-listens">Number of Listens</label>
            <input type="number" id="album-listens" required />
          </div>
          <div>
            <label for="album-artist-id">Artist ID</label>
            <input type="number" id="album-artist-id" required />
          </div>
          <div>
            <label for="album-delete-id">Album ID to Delete</label>
            <input type="number" id="album-delete-id" />
          </div>
        </div>
        <div class="button-row">
          <button type="submit" class="btn">Create</button>
          <button type="button" class="btn secondary" id="album-update-btn">Update</button>
          <button type="button" class="btn danger" id="album-delete-btn">Delete</button>
          <button type="button" class="btn ghost" id="album-reset-btn">Clear</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>All Albums</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Release Year</th>
              <th>Listens</th>
              <th>Artist ID</th>
              <th>Artist Name</th>
            </tr>
          </thead>
          <tbody id="albums-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/albums.js"></script>
</body>
</html>
